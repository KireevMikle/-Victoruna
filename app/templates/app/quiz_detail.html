<!DOCTYPE html>
{% load static %}
<link rel="stylesheet" href="{% static 'css/theme.css' %}">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ quiz.title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .quiz-info {
            text-align: center;
            margin-bottom: 30px;
        }
        button {
            padding: 14px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #ddba77;
            color: white;
        }
    </style>
</head>
<body>

<h1>{{ quiz.title }}</h1>

<div class="quiz-info">
    <p>{{ quiz.description }}</p>
    <p><strong>Total questions:</strong> {{ quiz.questions.count }}</p>

    {% if user.is_authenticated %}
        <a href="{% url 'quiz_question' quiz.id 1 %}">
            <button>Start Quiz</button>
        </a>
    {% else %}
        <p>
            You must <a href="{% url 'login' %}">log in</a> to start this quiz.
        </p>
    {% endif %}
</div>

</body>
</html>
